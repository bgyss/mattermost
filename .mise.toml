# Tools are provided by Nix via devenv.nix — run `nix develop` or `devenv shell`
# to enter the dev environment. mise is used only as a task runner here.
# [tools] is intentionally omitted; toolchain = nixpkgs via devenv.

[env]
_.file = ".env.agents"
MM_DEV = "true"
OPENCLAW_GATEWAY_URL = "http://127.0.0.1:18789"
MM_FEATUREFLAGS_ENABLEAIAGENTS = "true"

# ── Server (Go) tasks ──────────────────────────────────────────────────────────

[tasks."build:server"]
description = "Compile the Mattermost server binary for the current OS"
dir = "server"
run = "go build -trimpath -ldflags '-X github.com/mattermost/mattermost/server/public/model.BuildNumber=dev' -o bin/mattermost ./cmd/mattermost"

[tasks."build:server:linux"]
description = "Cross-compile the server binary for linux/amd64"
dir = "server"
run = "GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-X github.com/mattermost/mattermost/server/public/model.BuildNumber=dev' -o bin/mattermost-linux-amd64 ./cmd/mattermost"

[tasks."build:mmctl"]
description = "Build the mmctl CLI tool"
dir = "server"
run = "go build -trimpath -o bin/mmctl ./cmd/mmctl"

[tasks."check:server"]
description = "Vet the Go server packages"
dir = "server"
run = "go vet ./channels/... ./platform/... ./public/..."

[tasks."test:server:quick"]
description = "Run quick server tests (no Docker required)"
dir = "server/public"
run = "go test ./model/... -short"

# ── Webapp (Node/TypeScript) tasks ─────────────────────────────────────────────

[tasks."install:webapp"]
description = "Install webapp npm dependencies"
dir = "webapp"
run = "npm install"

[tasks."build:webapp"]
description = "Production build of the webapp (requires npm install first)"
dir = "webapp"
run = "npm run build"

[tasks."check:webapp"]
description = "Run ESLint on the webapp"
dir = "webapp"
run = "npm run check --workspace=channels"

[tasks."check:types"]
description = "TypeScript type-check the webapp"
dir = "webapp"
run = "npm run check-types"

[tasks."test:webapp"]
description = "Run Jest tests for the webapp"
dir = "webapp"
run = "npm run test --workspace=channels"

# ── Combined tasks ─────────────────────────────────────────────────────────────

[tasks."build"]
description = "Build everything: server binary + webapp (runs build:server and build:webapp)"
depends = ["build:server", "build:webapp"]

[tasks."build:server-only"]
description = "Build only the Go server binary (no webapp, no Docker)"
depends = ["build:server"]

[tasks."check"]
description = "Run all static checks: Go vet + webapp ESLint + TypeScript"
depends = ["check:server", "check:webapp", "check:types"]

[tasks."dev:server"]
description = "Run the server in development mode (requires Docker for Postgres)"
dir = "server"
run = "go run ./cmd/mattermost"

[tasks."dev:webapp"]
description = "Start the webpack dev server with hot reload"
dir = "webapp"
run = "npm run dev-server --workspace=channels"

# ── Agent demo tasks ───────────────────────────────────────────────────────────

[tasks."agents:db"]
description = "Start PostgreSQL via devenv (Nix-managed, no Docker required)"
run = "devenv services up postgres"

[tasks."agents:server"]
description = "Run the Mattermost server with OpenClaw agent env vars (requires agents:docker)"
dir = "server"
run = "go run ./cmd/mattermost"

[tasks."agents:webapp"]
description = "Start the webapp dev server (hot reload) for the agent demo"
dir = "webapp"
run = "npm run dev-server --workspace=channels"

[tasks."agents:provision"]
description = "Provision CEO + Sales demo agents via REST API (run after server is up)"
run = "bash scripts/provision-demo.sh"

[tasks."agents:status"]
description = "List all provisioned agent definitions"
run = """
TOKEN=$(curl -sf -X POST http://localhost:8065/api/v4/users/login \
  -H 'Content-Type: application/json' \
  -d "{\"login_id\":\"${MM_ADMIN_EMAIL:-admin@example.com}\",\"password\":\"${MM_ADMIN_PASSWORD}\"}" \
  -D - 2>/dev/null | grep -i '^token:' | awk '{print $2}' | tr -d '\\r')
curl -sf http://localhost:8065/api/v4/agents/definitions \
  -H "Authorization: Bearer $TOKEN" | jq '[.[] | {id, display_name, role, llm_service_id}]'
"""

# ── CI environment tasks ───────────────────────────────────────────────────────
# These scripts manage a fully ephemeral postgres + server environment.
# Run from within the devenv shell (direnv allow) so pg_ctl/go/etc. are on PATH.

[tasks."ci:up"]
description = "Init postgres, build + start server, seed admin/team/agents — full clean environment"
run = "bash scripts/ci-up.sh"

[tasks."ci:down"]
description = "Stop server + postgres and wipe all ephemeral state (data dir, logs, PIDs)"
run = "bash scripts/ci-down.sh"

[tasks."ci:reset"]
description = "Tear down then bring up a fresh environment in one shot"
run = ["mise run ci:down", "mise run ci:up"]

[tasks."ci:up:e2e"]
description = "Full CI environment + webpack dev server for Playwright E2E tests"
run = """
mise run ci:up
cd webapp && nohup npm run dev-server --workspace=channels > .devenv/webapp.log 2>&1 &
echo $! > .devenv/webapp.pid
echo "Waiting for webpack..."
for i in $(seq 1 60); do
  curl -sf http://localhost:9005 -o /dev/null && echo "Webapp ready" && break
  sleep 5
done
"""

[tasks."ci:logs"]
description = "Tail server and postgres logs"
run = "tail -f .devenv/server.log .devenv/postgres.log 2>/dev/null"

[tasks."ci:status"]
description = "Show status of CI environment processes"
run = """
echo "=== PostgreSQL ==="
pg_isready -h 127.0.0.1 -p 5432 2>/dev/null && echo "running" || echo "not running"
echo "=== Mattermost server ==="
if [ -f .devenv/server.pid ] && kill -0 $(cat .devenv/server.pid) 2>/dev/null; then
  echo "running (PID $(cat .devenv/server.pid))"
else
  echo "not running"
fi
echo "=== Health check ==="
curl -sf http://localhost:8065/api/v4/system/ping 2>/dev/null | jq '.status' || echo "not reachable"
"""

# ── Docs tasks (MkDocs) ────────────────────────────────────────────────────────

[tasks."docs:install"]
description = "Install MkDocs + plugins into .venv via uv (tools provided by Nix/devenv)"
run = "uv sync --extra docs"

[tasks."docs:serve"]
description = "Live-preview docs at http://localhost:8000 with hot reload"
run = "uv run mkdocs serve"

[tasks."docs:build"]
description = "Build static docs site to site/"
run = "uv run mkdocs build --strict"
